plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zenless.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.zenless.game'
        // holo era devices are supported, newer ones still get Theme.Holo from the framework
        minSdk 19
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    androidResources {
        // sounds are opened with openFd, which needs them stored uncompressed
        noCompress 'mp3', 'ogg'
    }

    lint {
        abortOnError false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
